# go-pugleaf: proxy settings shared by every location (/etc/nginx/snippets/).
# go-pugleaf takes the client IP from X-Forwarded-For only when the proxy's address is in its
# admin setting "Reverse Proxy Addresses" (ReverseProxyAddr), e.g. "127.0.0.1, ::1".
proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
