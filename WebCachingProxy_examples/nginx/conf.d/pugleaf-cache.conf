# go-pugleaf page cache (http context: /etc/nginx/conf.d/). Used by sites-available/pugleaf.*.
# Only anonymous GET/HEAD are cached; see the site file for what bypasses the cache.
# mkdir -p /var/cache/nginx/pugleaf && chown www-data: /var/cache/nginx/pugleaf
proxy_cache_path /var/cache/nginx/pugleaf levels=1:2 keys_zone=pugleaf_cache:64m max_size=5g inactive=7d use_temp_path=off;

# User-Agents that go-pugleaf blocks with 403 (admin setting "Bad Bots", lowercase substrings)
# must never be answered from the cache, or they would get pages go-pugleaf refuses them.
# Keep this list in step with the BadBots setting of the server behind this proxy.
map $http_user_agent $pugleaf_badbot {
    default 0;
    "~*(acunetix|ahref|alibaba|amazon|anticlone|census|censys|crawler|curl|deepseek|go-http|httrack|meta|mj12|paloalto|python|semrush|wget|claudebot|infrawatch|twitterbot)" 1;
}
