# go-pugleaf rate limits (http context: /etc/nginx/conf.d/). Used by sites-available/pugleaf.*.
#
# Everyone: 5 requests/s per client IP; the site allows bursts of 30 served at once (a page
# with its assets, quick clicking). Above that the client gets 429.
limit_req_zone $binary_remote_addr zone=pugleaf_ip:20m rate=5r/s;

# Crawlers by User-Agent: 1 request/s per client IP. Other agents get an empty key and are
# not counted in this zone.
map $http_user_agent $pugleaf_bot {
    default "";
    "~*(bot|crawl|spider|slurp|scrapy|infrawatch|python-requests|go-http-client|httpclient|wget|curl)" $binary_remote_addr;
}
limit_req_zone $pugleaf_bot zone=pugleaf_bots:10m rate=1r/s;

# Simultaneous connections per client IP (the site sets the number).
limit_conn_zone $binary_remote_addr zone=pugleaf_conn:10m;
