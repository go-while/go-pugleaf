# tcp2tor configuration file
# Format: listen_host:listen_port:target_host:target_port
# Example configurations for multiple NNTP servers through Tor
# 127.2.3.4:11119:peannyjkqwqfynd24p6dszvtchkq7hfkwymi5by5y332wmosy5dwfaqd.onion:119 # news.tcpreset.net
# 127.9.9.9:6667:ij7fmstcudrwyty5p6iloodeenur4wksovlhbyrfubat7eixplmrxvqd.onion:6667 # irc.pugleaf.net
#
# Listen hosts must be loopback addresses (127.x.x.x, localhost). tcp2tor has no authentication:
# a listener on a LAN or public address lets anyone who reaches it use your Tor client.
# A non-loopback listen host such as the one below is refused unless allow_public_bind = true.
# 192.168.1.100:2119:internal-ip.onion:119
#
# Optional settings (key = value). A flag given on the command line overrides the key.
# max_conns = 64            # concurrent connections per listener (flag -max-conns, 1-10000)
# idle_timeout = 10m        # close a connection after this long without traffic, e.g. 90s, 10m, 1h (flag -idle-timeout)
# allow_public_bind = false # permit non-loopback listen hosts (flag -allow-public-bind)
